# Release pipeline for the ilyalissoboi/ARMSX2 fork (X.Y.Z-fork.N releases).
#
# Builds the four tiered Android APKs with the same recipe as hand releases
# (platforms/android/tools/build-release-targets.sh: dual page-size cores, PGO, rotation
# signing), attaches them to the release legacy-first, and writes the notes.
#
# How to cut a release:
#   1. Merge everything into master, including .github/fork-release-notes/<VN>.md with the
#      hand-written part of the notes (see the README there).
#   2. Tag the master commit and push the tag:
#        git tag 2.9.2-fork.1 origin/master && git push origin 2.9.2-fork.1
#      or run this workflow from the Actions tab on master with the version filled in.
#   3. The run builds, uploads and publishes. Without a notes file for that version, or with
#      "publish" unticked, it stops at a draft for you to finish and publish by hand.
#
# The versionCode is the last published fork release's plus one, read from that release's
# legacy APK, unless the manual run gives one. The tagged commit has to be on master.
#
# A pull request that changes this workflow or its scripts runs it as a dry run: all four
# APKs are built and signed as 0.0.0-fork.0, the notes are written to the run summary, and
# no tag or release is touched.
#
# Secrets (from the fork's signing kit, E:/work/android-signing/armsx2):
#   FORK_RELEASE_KS_B64     base64 of the release keystore (armsx2_release.jks)
#   FORK_LINEAGE_B64        base64 of armsx2_signing_lineage.bin
#   FORK_DEBUG_KS_B64       base64 of the old (debug) signer's keystore
#   FORK_RELEASE_KS_PASS, FORK_RELEASE_KEY_ALIAS, FORK_RELEASE_KEY_PASS
# Optional:
#   FORK_RA_UA_VERSION      a RetroAchievements client version registered for this fork.
#                           Unset, the build identifies as stock PCSX2, as fork releases
#                           always have. Never put upstream's RA_UA_VERSION here.
#
# Not built: Discord (no SDK for the fork), and the PC/iOS targets the fork doesn't ship.
name: Fork Release

on:
  push:
    tags:
      - '*-fork.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without a leading v (e.g. 2.9.2-fork.1). Becomes the tag and the Android versionName.'
        required: true
        type: string
      version_code:
        description: 'Android versionCode. Leave empty to use the last fork release''s plus one.'
        required: false
        type: string
      publish:
        description: 'Publish when .github/fork-release-notes/<version>.md exists. Untick to always stop at a draft.'
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/fork-release.yml'
      - '.github/workflows/scripts/fork/**'

permissions:
  contents: read

# Real releases share one group, so two of them can't take the same versionCode: the second
# waits until the first has uploaded its APKs, then counts it (draft or not). GitHub keeps
# only one waiting run per group, so push a third tag after the second has started.
concurrency:
  group: fork-release-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The fork's release certificate. Every APK must carry it, or it won't install over
  # earlier fork releases.
  FORK_RELEASE_CERT_SHA256: 347dc73ad33a1157dcf798cbcdf514118dd8c8266c203b8044513bc01ec6eb3b

jobs:
  # ---- prepare: work out the version, check it, tag the commit, open the draft ----------
  prepare:
    name: Version, tag and draft
    # Only this fork. A pull request from another fork gets no secrets, so skip it too.
    if: >-
      github.repository == 'ilyalissoboi/ARMSX2' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      vn: ${{ steps.version.outputs.vn }}
      vc: ${{ steps.vc.outputs.vc }}
      sha: ${{ steps.version.outputs.sha }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      prev_tag: ${{ steps.vc.outputs.prev_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_VC: ${{ inputs.version_code }}
    steps:
      - name: Work out the version
        id: version
        run: |
          case "$EVENT" in
            push)              VN="$GITHUB_REF_NAME"; DRY=false ;;
            workflow_dispatch) VN="$INPUT_VERSION";   DRY=false ;;
            pull_request)      VN="0.0.0-fork.0";     DRY=true ;;
          esac
          # A pull request's GITHUB_SHA is a merge commit; build the branch head instead.
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$VN" =~ ^[0-9]+(\.[0-9]+)+-fork\.[0-9]+$ ]] || { echo "::error::version '$VN' is not like 2.9.2-fork.1"; exit 1; }
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "Version $VN at $SHA (dry run: $DRY)"

      # Releases are cut from master only, so a tag pushed on a feature branch can't ship.
      - name: Check the commit is on master
        if: steps.version.outputs.dry_run == 'false'
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$SHA" --jq .status)"
          case "$STATUS" in
            identical|behind) echo "$SHA is on master" ;;
            *) echo "::error::$SHA is not on master (compare status: $STATUS). Merge it first."; exit 1 ;;
          esac

      # A versionCode at or below the installed one makes Android refuse the update, and
      # nothing about the APK itself shows that. Read it from the newest other fork release
      # that has a legacy APK, drafts included, so a release still waiting to be published
      # keeps its versionCode. The notes' "previous release" is the newest published one.
      - name: Work out the versionCode
        id: vc
        env:
          VN: ${{ steps.version.outputs.vn }}
        run: |
          LIST="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases -L 100 --json tagName,isDraft \
            --jq '.[] | select(.tagName | test("-fork[.][0-9]+$")) | "\(.tagName) \(.isDraft)"' | grep -v "^$VN " || true)"
          PREV="$(awk '$2 == "false" { print $1; exit }' <<<"$LIST")"
          [ -n "$PREV" ] || { echo "::error::no earlier published fork release"; exit 1; }
          FROM=""
          for tag in $(awk '{ print $1 }' <<<"$LIST"); do
            if gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*-sdk26.apk' -O last.apk --clobber 2>/dev/null; then
              FROM="$tag"; break
            fi
          done
          [ -n "$FROM" ] || { echo "::error::no earlier fork release has a legacy APK to take the versionCode from"; exit 1; }
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          LAST_VC="$("$AAPT" dump badging last.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          [[ "$LAST_VC" =~ ^[0-9]+$ ]] || { echo "::error::could not read the versionCode of $FROM"; exit 1; }
          echo "$FROM has versionCode $LAST_VC"
          PREV_VC_TAG="$FROM"
          VC="${INPUT_VC:-$((LAST_VC + 1))}"
          [[ "$VC" =~ ^[0-9]+$ ]] || { echo "::error::version_code '$VC' is not a number"; exit 1; }
          [ "$VC" -gt "$LAST_VC" ] || { echo "::error::version_code $VC must be higher than $PREV_VC_TAG's $LAST_VC"; exit 1; }
          echo "Using versionCode $VC"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"

      # gh api prints a 404's error body on stdout, so a missing tag is told by the exit status.
      # A pushed tag already exists; a manual run creates it. Either way it must stay put.
      - name: Tag the commit
        if: steps.version.outputs.dry_run == 'false'
        env:
          VN: ${{ steps.version.outputs.vn }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VN" --jq .object.sha 2>/dev/null)"; then
            # An annotated tag points at a tag object; follow it to the commit.
            TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VN" --jq .object.type)"
            [ "$TYPE" != "tag" ] || EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$EXISTING" --jq .object.sha)"
            if [ "$EXISTING" = "$SHA" ]; then
              echo "$VN already points at $SHA"
            else
              echo "::error::tag $VN already exists on $EXISTING, not $SHA. Never move a release tag."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VN" -f sha="$SHA" >/dev/null
            echo "Tagged $SHA as $VN"
          fi

      - name: Open the draft release
        if: steps.version.outputs.dry_run == 'false'
        env:
          VN: ${{ steps.version.outputs.vn }}
        run: |
          DRAFT="$(gh release view "$VN" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -z "$DRAFT" ]; then
            gh release create "$VN" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "ARMSX2 $VN" --notes ""
          elif [ "$DRAFT" != "true" ]; then
            echo "::error::release $VN is already published"
            exit 1
          fi

  # ---- Android: one job per tier ------------------------------------------------------
  android:
    name: Android (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, a11, a13, a15]
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools"; Google removed the
          # legacy "tools" package, so installing it fails the whole job.
          packages: platform-tools

      # Must match the NDK build-release-targets.sh pins for every tier.
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # Optional: without FORK_RA_UA_VERSION this only warns, and the build identifies as
      # stock PCSX2 like every fork release so far.
      - name: Embed the RetroAchievements client identity
        working-directory: ${{ github.workspace }}
        env:
          RA_UA_VERSION: ${{ secrets.FORK_RA_UA_VERSION }}
        run: bash .github/workflows/scripts/common/write-ra-ua-secret.sh

      - name: Decode the signing keys
        env:
          DEBUG_KS_B64: ${{ secrets.FORK_DEBUG_KS_B64 }}
          RELEASE_KS_B64: ${{ secrets.FORK_RELEASE_KS_B64 }}
          LINEAGE_B64: ${{ secrets.FORK_LINEAGE_B64 }}
        run: |
          for v in DEBUG_KS_B64 RELEASE_KS_B64 LINEAGE_B64; do
            [ -n "${!v}" ] || { echo "::error::secret FORK_${v} is not set"; exit 1; }
          done
          printf '%s' "$DEBUG_KS_B64"   | base64 -d > "$RUNNER_TEMP/debug.jks"
          printf '%s' "$RELEASE_KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$LINEAGE_B64"    | base64 -d > "$RUNNER_TEMP/lineage.bin"

      - name: Build ${{ matrix.target }} APK
        env:
          VC: ${{ needs.prepare.outputs.vc }}
          VN: ${{ needs.prepare.outputs.vn }}
          OUTDIR: ${{ runner.temp }}/apk
          PROF: ${{ github.workspace }}/platforms/android/pgo/armsx2.profdata
          DEBUG_KS: ${{ runner.temp }}/debug.jks
          LINEAGE: ${{ runner.temp }}/lineage.bin
          RELEASE_KS: ${{ runner.temp }}/release.jks
          RELEASE_KS_PASS: ${{ secrets.FORK_RELEASE_KS_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.FORK_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.FORK_RELEASE_KEY_PASS }}
        run: |
          mkdir -p "$OUTDIR"
          tools/build-release-targets.sh "${{ matrix.target }}"

      # The APK must carry the fork's release certificate and the requested version, or
      # it won't update an existing install.
      - name: Check the signer and version
        env:
          VC: ${{ needs.prepare.outputs.vc }}
          VN: ${{ needs.prepare.outputs.vn }}
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/apk/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected one APK in $RUNNER_TEMP/apk, found ${#apks[@]}"; exit 1; }
          BT="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)")"
          CERTS="$("$BT/apksigner" verify --print-certs "${apks[0]}")"
          grep -q "certificate SHA-256 digest: $FORK_RELEASE_CERT_SHA256" <<<"$CERTS" \
            || { echo "$CERTS"; echo "::error::APK is not signed with the fork's release certificate"; exit 1; }
          BADGING="$("$BT/aapt2" dump badging "${apks[0]}" | head -1)"
          echo "$BADGING"
          grep -q "versionCode='$VC'" <<<"$BADGING" || { echo "::error::versionCode is not $VC"; exit 1; }
          grep -q "versionName='$VN'" <<<"$BADGING" || { echo "::error::versionName is not $VN"; exit 1; }

      # The client doesn't report a refused agent, so check both cores carry the identity.
      # Without FORK_RA_UA_VERSION there's nothing to check and the script says so.
      - name: Verify the client identity reached both cores
        env:
          RA_UA_VERSION: ${{ secrets.FORK_RA_UA_VERSION }}
        run: |
          apk="$(ls "$RUNNER_TEMP"/apk/*.apk)"
          for core in libemucore_4k libemucore_16k; do
            unzip -p "$apk" "lib/arm64-v8a/$core.so" > "$RUNNER_TEMP/$core.so"
            bash "$GITHUB_WORKSPACE/.github/workflows/scripts/common/verify-ra-ua-agent.sh" "$RUNNER_TEMP/$core.so" armsx2
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-android-${{ matrix.target }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.dry_run == 'true' && 3 || 30 }}

  # ---- upload, write the notes, publish -------------------------------------------------
  release:
    name: Upload and publish
    needs: [prepare, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VN: ${{ needs.prepare.outputs.vn }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      # A pushed tag has no inputs, so it publishes whenever the notes file is there.
      WANT_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: .github

      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: armsx2-android-*
          merge-multiple: true

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
          APK_DIR: dl
        run: |
          bash .github/workflows/scripts/fork/release-notes.sh > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          (cd dl && sha256sum *.apk)

      # UPLOAD THE LEGACY APK FIRST. Updaters up to 2.6.6.6 take the release's first .apk
      # whatever its name, and GitHub lists assets in upload order. A re-run clears the
      # draft's assets first, so the order can't drift.
      - name: Upload in order
        if: env.DRY_RUN == 'false'
        run: |
          gh release view "$VN" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | while read -r name; do gh release delete-asset "$VN" "$name" -R "$GITHUB_REPOSITORY" -y; done
          for t in legacy-armv8.0-sdk26 a11-armv8.2-sdk30 a13-armv8.2-sdk33 a15-armv8.2-sdk35; do
            gh release upload "$VN" "dl/ARMSX2-${VN}-${t}.apk" -R "$GITHUB_REPOSITORY"
          done

      - name: Publish, or leave the draft
        if: env.DRY_RUN == 'false'
        run: |
          URL="${{ github.server_url }}/$GITHUB_REPOSITORY/releases"
          if [ -f ".github/fork-release-notes/$VN.md" ] && [ "$WANT_PUBLISH" = "true" ]; then
            gh release edit "$VN" -R "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest
            echo "Published $URL/tag/$VN" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$VN" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            if [ -f ".github/fork-release-notes/$VN.md" ]; then
              why="publish was unticked"
            else
              why="there's no .github/fork-release-notes/$VN.md in the released commit"
            fi
            echo "::notice::Left $VN as a draft because $why. Finish the notes and publish it at $URL."
            echo "Left $VN as a draft because $why: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
